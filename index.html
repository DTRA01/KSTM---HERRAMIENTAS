<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Servicio de Tráfico Marítimo</title>
  <style>
    /* Estilos Generales para formato de informe A4 */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #eef2f5;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .informe-container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 40px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }

    /* ENCABEZADO CON ESCUDO A LA IZQUIERDA Y MÁS GRANDE */
    .header-container {
      display: flex;
      align-items: center;
      gap: 30px; /* Separación con el título */
      border-bottom: 3px solid #003366;
      padding-bottom: 20px;
      margin-bottom: 30px;
    }

    /* Escudo agrandado a la izquierda */
    .escudo-logo {
      width: 160px; /* Tamaño grande ajustado */
      height: auto;
      object-fit: contain;
    }

    .header-info {
      flex: 1;
    }

    .header-info h1 {
      margin: 0;
      font-size: 24px;
      color: #003366;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .header-info h2 {
      margin: 5px 0 0 0;
      font-size: 16px;
      color: #555;
      font-weight: 500;
    }

    /* Estructura de Secciones */
    .seccion {
      margin-bottom: 25px;
      background: #f9fbfd;
      border: 1px solid #dce4ec;
      border-left: 5px solid #003366;
      border-radius: 4px;
      padding: 15px 20px;
    }

    .seccion-titulo {
      font-size: 18px;
      font-weight: bold;
      color: #003366;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Tablas y Campos de Control */
    .control-group {
      display: flex;
      gap: 15px;
      margin-bottom: 10px;
      align-items: center;
    }

    label {
      font-weight: 600;
      font-size: 14px;
    }

    input[type="text"], select, textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    /* Botones de Acción */
    .acciones-bar {
      display: flex;
      justify-content: flex-end;
      gap: 15px;
      margin-top: 30px;
    }

    .btn {
      padding: 10px 20px;
      font-size: 15px;
      font-weight: bold;
      color: #fff;
      background-color: #003366;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #002244;
    }

    .btn-export {
      background-color: #28a745;
    }

    .btn-export:hover {
      background-color: #218838;
    }

    /* Ajustes para Impresión y Exportación a Word */
    @media print {
      body { background: none; padding: 0; }
      .informe-container { box-shadow: none; padding: 0; }
      .acciones-bar { display: none; }
    }
  </style>
</head>
<body>

  <div class="informe-container" id="informe-completo">
    
    <!-- Encabezado Principal -->
    <header class="header-container">
      <!-- Coloca aquí el nombre exacto de la imagen de tu escudo -->
      <img src="escudo.png" alt="Escudo Oficial" class="escudo-logo">
      <div class="header-info">
        <h1>Servicio de Tráfico Marítimo</h1>
        <h2>Informe Operativo General y Control de Novedades</h2>
      </div>
    </header>

    <!-- Secciones del Informe Operativo -->

    <!-- Seccion SAR -->
    <div class="seccion">
      <div class="seccion-titulo">
        <span>Búsqueda y Salvamento (SAR)</span>
        <select style="width: 180px;">
          <option value="normal">Estado: Normal</option>
          <option value="alerta">Estado: Alerta</option>
          <option value="operacion">En Operación</option>
        </select>
      </div>
      <textarea placeholder="Ingrese novedades relativas a casos SAR..."></textarea>
    </div>

    <!-- Seccion MAS -->
    <div class="seccion">
      <div class="seccion-titulo">
        <span>Servicios de Asistencia Marítima (MAS)</span>
        <select style="width: 180px;">
          <option value="sin_novedad">Sin Novedad</option>
          <option value="pendiente">Monitoreo Pendiente</option>
          <option value="activo">Caso Activo</option>
        </select>
      </div>
      <textarea placeholder="Ingrese detalles de asistencia o comunicaciones MAS..."></textarea>
    </div>

    <!-- Seccion Pilotaje -->
    <div class="seccion">
      <div class="seccion-titulo">Pilotaje y Practicaje</div>
      <textarea placeholder="Estado de prácticos, maniobras asignadas y coordinaciones..."></textarea>
    </div>

    <!-- Seccion Metaneros -->
    <div class="seccion">
      <div class="seccion-titulo">Buques Metaneros (LNG)</div>
      <textarea placeholder="Ingreso, amarre o zarpada de buques metaneros..."></textarea>
    </div>

    <!-- Seccion PBIP -->
    <div class="seccion">
      <div class="seccion-titulo">Protección Buques e Instalaciones Portuarias (PBIP)</div>
      <textarea placeholder="Nivel de protección y novedades relativas a PBIP..."></textarea>
    </div>

    <!-- Otras Novedades -->
    <div class="seccion">
      <div class="seccion-titulo">Otras Novedades / Observaciones Generales</div>
      <textarea placeholder="Cualquier otra novedad relevante de la guardia o del tráfico marítimo..."></textarea>
    </div>

    <!-- Botones para Descargar y Exportar -->
    <div class="acciones-bar">
      <button class="btn" onclick="window.print()">Imprimir / Guardar PDF</button>
      <button class="btn btn-export" onclick="exportarAWord()">Exportar a Word</button>
    </div>

  </div>

  <script>
    // Función para exportar la vista a un archivo editable de Microsoft Word
    function exportarAWord() {
      var header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' "+
            "xmlns:w='urn:schemas-microsoft-com:office:word' "+
            "xmlns='http://www.w3.org/TR/REC-html40'>"+
            "<head><meta charset='utf-8'><title>Export Word</title></head><body>";
      var footer = "</body></html>";
      var sourceHTML = header + document.getElementById("informe-completo").innerHTML + footer;
      
      var source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
      var fileDownload = document.createElement("a");
      document.body.appendChild(fileDownload);
      fileDownload.href = source;
      fileDownload.download = 'Informe_Trafico_Maritimo.doc';
      fileDownload.click();
      document.body.removeChild(fileDownload);
    }
  </script>

</body>
</html>
